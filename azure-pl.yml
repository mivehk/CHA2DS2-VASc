# Azure Devops Pipeline

trigger:
- Initial_H

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildDir: 'out'
  jarName: 'cha2ds2-vasc.jar'
  mainClass: 'chadsVascCalculatorGUI'

stages:
- stage: Clone
  displayName: 'Clone Repository'
  jobs:
  - job: Checkout
    steps:
    - checkout: self

- stage: Compile
  displayName: 'Compile Java Files'
  jobs:
  - job: CompileJob
    steps:
    - script: |
        mkdir -p out
        find src -name "*.java" > sources.txt
        javac -d out @sources.txt
        echo "📁 Listing out directory contents:"
        ls -R out
      displayName: 'Compile .java files'
    - publish: out
      artifact: compiled-classes


- stage: Package
  displayName: 'Package JAR'
  jobs:
  - job: PackageJob
    steps:
    - download: current
      artifact: compiled-classes
    - script: |
        echo "Main-Class: chadsVascCalculatorGUI" > MANIFEST.MF
        jar cvfm cha2ds2-vasc.jar MANIFEST.MF -C compiled-classes .
      displayName: 'Create JAR File'

- stage: Archive
  displayName: 'Archive Artifacts'
  jobs:
  - job: ArchiveJob
    steps:
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(jarName)'
        ArtifactName: 'jar-package'
        publishLocation: 'Container'
